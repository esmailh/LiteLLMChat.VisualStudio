name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze C#
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Restore
        shell: pwsh
        run: |
          $projects = @(
            'src\LiteLLM.Core\LiteLLM.Core.csproj',
            'src\LiteLLM.GitWrapper\LiteLLM.GitWrapper.csproj',
            'src\LiteLLM.VisualStudio\LiteLLM.VisualStudio.csproj',
            'tests\LiteLLM.Core.Tests\LiteLLM.Core.Tests.csproj'
          )
          foreach ($project in $projects) {
            msbuild $project /t:Restore /p:Configuration=Debug /v:m /nologo
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build
        shell: pwsh
        run: |
          $projects = @(
            'src\LiteLLM.Core\LiteLLM.Core.csproj',
            'src\LiteLLM.GitWrapper\LiteLLM.GitWrapper.csproj',
            'src\LiteLLM.VisualStudio\LiteLLM.VisualStudio.csproj',
            'tests\LiteLLM.Core.Tests\LiteLLM.Core.Tests.csproj'
          )
          foreach ($project in $projects) {
            msbuild $project /t:Build /p:Configuration=Debug /v:m /nologo
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Analyze
        uses: github/codeql-action/analyze@v3
